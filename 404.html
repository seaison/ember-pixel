<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Ember Pixel</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/ember-pixel/assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#060606">
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: #060606;
    color: #F7F1E7;
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    text-align: center;
  }
  .mark {
    display: grid;
    place-items: center;
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    background: #FC5C1E;
    color: #0A0705;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .code { color: #FC5C1E; font-size: 10px; letter-spacing: 0.24em; }
  h1 { margin: 12px 0 16px; font-size: 28px; letter-spacing: 0.04em; }
  p { margin: 0; color: #B7AC9E; font-size: 14px; line-height: 1.8; }
  a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    margin-top: 24px;
    padding: 0 16px;
    border: 2px solid #FC5C1E;
    color: #FC5C1E;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-decoration: none;
  }
  a:focus-visible { outline: 2px solid #F7F1E7; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">EP</div>
    <div class="code">404 / SIGNAL LOST</div>
    <h1>这条链路不存在</h1>
    <p>坐标可能错了，或者信号已经离开覆盖区。</p>
    <a href="/ember-pixel/">BACK TO SYSTEM</a>
  </main>
</body>
</html>
